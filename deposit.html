<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styledeposit.css">
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card custom-card p-4 bg-white">
                <div class="card-body">
                    <h2 class="titulo-depositar fw-bold mb-4 text-center">Depositar</h2>
                    
                    <form action="menu.html" method="GET">
                        <div class="mb-4">
                            <label for="amount" class="form-label fw-semibold">Monto a depositar</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-muted">$</span>
                                <input type="number" class="form-control" id="amount" placeholder="0.00" min="1" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-color btn-lg mb-2">Realizar depósito</button>
                            <a href="menu.html" class="btn btn-cancelar ">Cancelar y volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
