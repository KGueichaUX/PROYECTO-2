<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Depositar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styledeposit.css">
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card custom-card p-4 bg-white">
                <div class="card-body">
                    <h2 class="titulo-depositar fw-bold mb-2 text-center">Depositar</h2>
                    <p class="text-center text-muted mb-4">
                        Saldo actual: <strong id="currentBalance">$0</strong>
                    </p>

                    <div id="alertBox" class="d-none" role="alert"></div>

                    <form id="depositForm">
                        <label for="amount" class="form-label fw-semibold">Monto a depositar (CLP)</label>
                        <div class="input-group mb-4">
                            <span class="input-group-text">$</span>
                            <input type="number" class="form-control" id="amount" min="1" step="1" placeholder="10000" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-color fw-bold py-2">Depositar</button>
                        </div>
                    </form>

                    <hr class="text-muted">
                    <div class="text-center mt-3">
                        <a href="menu.html" class="btn btn-cancelar">Volver al menú</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/wallet.js"></script>
<script src="./js/deposit.js"></script>
</body>
</html>
