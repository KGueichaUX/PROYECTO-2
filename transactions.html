<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Últimos Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styletransaction.css">
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card custom-card p-4 bg-white">
                <div class="card-body">
                    <h2 class="titulo-movimientos fw-bold mb-4 text-center">Últimos Movimientos</h2>
                    
                    <div class="list-group list-group-flush mb-4">
                        <div class="list-group-item income d-flex justify-content-between align-items-center py-3 px-3 mb-2 bg-light rounded shadow-sm">
                            <div>
                                <h6 class="mb-0 fw-bold">Depósito en Efectivo</h6>
                                <small class="text-muted">Hoy, 14:25 PM</small>
                            </div>
                            <span class="badge bg-success-subtle text-success p-2 fs-6 fw-bold">+$350.00</span>
                        </div>
                        
                        <div class="list-group-item expense d-flex justify-content-between align-items-center py-3 px-3 mb-2 bg-light rounded shadow-sm">
                            <div>
                                <h6 class="mb-0 fw-bold">Transferencia a Juan Pérez</h6>
                                <small class="text-muted">Ayer, 18:12 PM</small>
                            </div>
                            <span class="badge bg-danger-subtle text-danger p-2 fs-6 fw-bold">-$120.00</span>
                        </div>

                        <div class="list-group-item income d-flex justify-content-between align-items-center py-3 px-3 mb-2 bg-light rounded shadow-sm">
                            <div>
                                <h6 class="mb-0 fw-bold">Depósito Automático</h6>
                                <small class="text-muted">18 Jun 2026</small>
                            </div>
                            <span class="badge bg-success-subtle text-success p-2 fs-6 fw-bold">+$1,020.50</span>
                        </div>
                    </div>

                    <div class="d-grid pt-2">
                        <a href="menu.html" class="btn btn-primary fw-bold py-2 shadow-sm">Volver al Menú Principal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
